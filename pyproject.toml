[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsp"
version = "0.1.0"
description = "Reproduction work on 'Sparks of Weight-Space Programming': the Qwen3.5-0.8B looping fix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.13.0",
    "transformers==5.19.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/wsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["papers/weight-space-programming/replicate"]  # upstream scripts and the GPU probe
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
